<!doctype html><html><head><meta charset="utf-8"><title>AI Workflow Agent</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}textarea{width:100%;height:100px}input,button,textarea{font-size:16px;margin:8px 0;padding:10px;box-sizing:border-box}button{cursor:pointer}.card{background:#f5f5f5;padding:16px;border-radius:10px;margin-top:16px}pre{white-space:pre-wrap}</style></head><body><h1>AI Agent Workflow Automation</h1><p>One reusable agent routes requests to Excel-defined workflows and returns an auditable execution trace.</p><textarea id="request">Which products need restocking?</textarea><input id="context" style="width:100%" value='{"inventory_file":"data/inventory.csv"}'><button onclick="run()">Run Agent</button><div id="out"></div><script>async function run(){let r=document.getElementById('request').value,c=JSON.parse(document.getElementById('context').value||'{}');let x=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:r,context:c})});let d=await x.json();document.getElementById('out').innerHTML='<div class="card"><b>Selected Workflow:</b> '+d.selected_workflow.id+' — '+d.selected_workflow.name+'<br><b>Selected by:</b> '+d.selected_workflow.selected_by+'<pre>'+JSON.stringify(d,null,2)+'</pre></div>'}</script></body></html>
